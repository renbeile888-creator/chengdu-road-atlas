# 每天在云端重抓 154 个坐标点的十日预报，重建 dataset.js 并发布到 GitHub Pages。
# 每天两次，schedule 用 UTC：7:07 = 北京 15:07，15:40 = 北京 23:40。
# （UTC+8，北京 15:07 对应 UTC 07:07，北京 23:40 对应 UTC 15:40。）
# 为什么是这两档：GitHub 定时常晚 1—8 小时，只有实际抓取跨过零点，updated_date 才是当天，
# 否则次日上午打开页面看到的还是上一天的预报。原 22:07 档 8 次实测有 2 次落在 23:13/23:16，
# 推后到 23:40 后 8/8 都能跨零点（所需最小延迟从 53 分钟降到 20 分钟）。
# 原 08:07 档 5 次里 4 次落在 14:14—15:02，与 15:07 档重叠而冗余，故删除。
# TZ 必须在 job 级设为 Asia/Shanghai，否则 update.py 里的 date.today() 会按 UTC 写
# updated_date，比北京慢一天，前端会误判数据过期并弹出过期提示条。
# 抓取只用 Python 标准库，无需 pip install；失败率超阈值时脚本自行放弃，
# 本 workflow 随之失败，线上保留上一次成功部署的数据。

name: Refresh weather and deploy Pages

on:
  schedule:
    # 北京 15:07：实测最准的一档（平均仅晚 0.48 小时）。
    # 北京 23:40：为 GitHub 调度的 1—8 小时延迟留足缓冲，确保跨过零点。
    - cron: '7 7 * * *'
    - cron: '40 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CD_MIN_INTERVAL: '0.9'

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refresh 10-day forecast
        run: |
          python3 tools/update.py --force --jobs 2 || {
            echo '首次抓取未达标，等待 60 秒后重试一次'
            sleep 60
            python3 tools/update.py --force --jobs 2
          }

      - name: Copy dataset into publish root
        run: |
          mkdir -p site/data
          cp data/dataset.js site/data/dataset.js
          python3 - <<'PY'
          import json, pathlib, re
          s = pathlib.Path('site/data/dataset.js').read_text(encoding='utf-8')
          assert 'window.DESTINATIONS=' in s and len(s) > 100000, 'dataset.js 异常'
          w = json.loads(pathlib.Path('data/weather.json').read_text(encoding='utf-8'))
          print('date:', w['_meta']['updated_date'], '| points:', len(w['points']),
                '| failed:', w['_meta']['failed'])
          # 单位防线：CI 出口 IP 在美国时 meteoblue 会返回华氏度（曾把 49°F 写成 49°C）。
          # 抓取器已自动换算，这里再兜一次底，异常就不部署。
          data = json.loads(re.search(r'window\.DESTINATIONS=(\[.*\]);\s*$', s, re.S).group(1))
          temps = [y['tmax'] for x in data for y in x['weather'] if y.get('tmax') is not None]
          hi, avg = max(temps), sum(temps) / len(temps)
          assert hi <= 55 and avg <= 40, 'temperature unit suspicious: max=%s mean=%.1f' % (hi, avg)
          print('temp check: max %.1f C / mean %.1f C' % (hi, avg))
          # 日期防线：meteoblue 按 UTC 排期，凌晨抓取会多给一天昨天；build_data 已裁掉，
          # 这里确认裁干净，避免页面多出一整列已过日期并触发「起始日」提示。
          upd = w['_meta']['updated_date']
          stale = [(x['id'], y['date']) for x in data for y in x['weather'] if y['date'] < upd]
          assert not stale, 'stale forecast rows: %s' % stale[:3]
          print('forecast starts:', sorted({x['weather'][0]['date'] for x in data if x['weather']}),
                '| stale rows:', len(stale))
          PY

      - name: Commit refreshed data back to repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather.json data/dataset.js site/data/dataset.js
          if git diff --cached --quiet; then
            echo '数据无变化，跳过提交'
          else
            git commit -m "chore: refresh weather $(date +%F)"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
